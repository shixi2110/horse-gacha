
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界競走馬ガチャ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101e19;
  color: #f4f0e5;
  font-family: sans-serif;
  text-align: center;
}
main {
  max-width: 600px;
  margin: auto;
  padding: 24px 16px;
}
h1 { color: #dfc18a; font-size: 28px; }
.subtitle {
  color: #b3c7b9;
  font-size: 12px;
  letter-spacing: 3px;
}
.panel {
  background: #1c3027;
  border: 1px solid #40594a;
  border-radius: 16px;
  padding: 20px;
  margin: 20px 0;
}
.countries {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  text-align: left;
}
label {
  background: #293f34;
  padding: 14px 8px;
  border-radius: 8px;
  font-size: 14px;
}
input { accent-color: #dfc18a; }
button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}
.small {
  background: #40594a;
  color: white;
  margin: 12px 3px;
}
#draw {
  width: 100%;
  padding: 20px;
  background: #dfc18a;
  color: #142b23;
  font-size: 20px;
}
button:disabled { opacity: .5; }
#horse {
  font-size: 26px;
  color: #dfc18a;
  overflow-wrap: anywhere;
}
a { color: #dfc18a; }
#status {
  font-size: 13px;
  color: #b3c7b9;
  line-height: 1.7;
}
footer {
  font-size: 11px;
  color: #92a99b;
  line-height: 1.8;
}
</style>
</head>
<body>
<main>
<p class="subtitle">WORLD HORSE DISCOVERY</p>
<h1>🐎 世界競走馬ガチャ</h1>
<p>国境も時代も越えて、未知の名馬へ。</p>

<div class="panel">
<h3>抽選対象を選択</h3>
<div class="countries" id="countries"></div>
<button class="small" onclick="selectAll(true)">全選択</button>
<button class="small" onclick="selectAll(false)">全解除</button>
<button id="draw" onclick="drawHorse()">🐎 競走馬を発掘する</button>
<p id="status">9カ国・地域から選択できます</p>
</div>

<div class="panel" id="result" hidden>
<p>DISCOVERED HORSE</p>
<p id="country"></p>
<h2 id="horse"></h2>
<p id="links"></p>
</div>

<footer>
WORLD HORSE DISCOVERY — Ver.1.0<br>
Data source: Wikipedia / MediaWiki API<br>
原則として生産国別・香港は競走馬カテゴリ<br>
Wikipedia掲載馬を対象としています
</footer>
</main>

<script>
const countries = [
  ["🇮🇪 アイルランド", "Racehorses bred in Ireland", "en"],
  ["🇬🇧 イギリス", "Racehorses bred in the United Kingdom", "en"],
  ["🇫🇷 フランス", "Racehorses bred in France", "en"],
  ["🇩🇪 ドイツ", "Racehorses bred in Germany", "en"],
  ["🇺🇸 アメリカ", "Racehorses bred in the United States", "en"],
  ["🇨🇦 カナダ", "Racehorses bred in Canada", "en"],
  ["🇭🇰 香港", "Racehorses in Hong Kong", "en"],
  ["🇦🇺 オーストラリア", "Racehorses bred in Australia", "en"],
  ["🇯🇵 日本", "Racehorses bred in Japan", "en"]
];

const cache = new Map();
const container = document.getElementById("countries");

countries.forEach((c, i) => {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.value = i;
  input.checked = true;
  label.append(input, " " + c[0]);
  container.appendChild(label);
});

function selectAll(value) {
  document.querySelectorAll("input[type=checkbox]")
    .forEach(x => x.checked = value);
}

async function loadCountry(index) {
  if (cache.has(index)) return cache.get(index);

  const [name, category, lang] = countries[index];
  const queue = [category];
  const visited = new Set();
  const horses = new Map();

  while (queue.length) {
    const cat = queue.shift();
    if (visited.has(cat)) continue;
    visited.add(cat);

    let continuation = {};
    do {
      const params = new URLSearchParams({
        action: "query",
        list: "categorymembers",
        cmtitle: "Category:" + cat,
        cmtype: "page|subcat",
        cmlimit: "500",
        format: "json",
        origin: "*",
        ...continuation
      });

      const response = await fetch(
        "https://" + lang + ".wikipedia.org/w/api.php?" + params
      );

      if (!response.ok) throw new Error(name);
      const data = await response.json();
      if (data.error) throw new Error(data.error.info);

      for (const item of data.query.categorymembers) {
        if (item.ns === 0) {
          if (/^List of |^Lists of /i.test(item.title)) continue;
          horses.set(item.pageid, {
            id: item.pageid,
            title: item.title,
            country: name,
            lang: lang
          });
        } else if (item.ns === 14) {
          const sub = item.title.replace(/^Category:/, "");
          if (/^Racehorses bred in /i.test(sub)) {
            queue.push(sub);
          }
        }
      }
      continuation = data.continue || null;
    } while (continuation);
  }

  const result = [...horses.values()];
  if (!result.length) throw new Error(name + "：候補なし");
  cache.set(index, result);
  return result;
}

async function drawHorse() {
  const selected = [...document.querySelectorAll("input:checked")]
    .map(x => Number(x.value));
  const status = document.getElementById("status");
  const button = document.getElementById("draw");

  if (!selected.length) {
    status.textContent = "国・地域を選択してください";
    return;
  }

  button.disabled = true;
  document.getElementById("result").hidden = true;

  try {
    const pool = new Map();

    for (const index of selected) {
      status.textContent =
        countries[index][0] + " の競走馬を取得中…";

      const horses = await loadCountry(index);
      for (const horse of horses) {
        const key = horse.lang + ":" + horse.id;
        if (!pool.has(key)) pool.set(key, horse);
      }
    }

    const list = [...pool.values()];
    const horse = list[Math.floor(Math.random() * list.length)];

    document.getElementById("horse").textContent = horse.title;
    document.getElementById("country").textContent = horse.country;

    const links = document.getElementById("links");
    links.replaceChildren();

    const wiki = document.createElement("a");
    wiki.href = "https://" + horse.lang +
      ".wikipedia.org/?curid=" + horse.id;
    wiki.target = "_blank";
    wiki.rel = "noopener";
    wiki.textContent = "Wikipediaで調べる ↗";
    links.appendChild(wiki);

    document.getElementById("result").hidden = false;
    status.textContent =
      "抽選対象：" + list.length.toLocaleString() + " 記事";

  } catch (error) {
    status.textContent =
      "取得できませんでした：" + error.message +
      "。国を絞って再試行してください。";
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
