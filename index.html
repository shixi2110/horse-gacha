
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界競走馬ガチャ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101e19;
 color:#f4f0e5;font-family:sans-serif;
 text-align:center
}
main{max-width:600px;margin:auto;padding:24px 16px}
h1,h2{color:#dfc18a}
.subtitle{color:#b3c7b9;font-size:12px;letter-spacing:3px}
.panel{
 background:#1c3027;border:1px solid #40594a;
 border-radius:16px;padding:20px;margin:20px 0
}
.countries{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;text-align:left
}
label{
 background:#293f34;padding:14px 8px;
 border-radius:8px;font-size:14px
}
input{accent-color:#dfc18a}
button{
 border:0;border-radius:10px;padding:12px;
 font-size:15px;font-weight:bold;cursor:pointer
}
.small{background:#40594a;color:white;margin:12px 3px}
#draw{
 width:100%;padding:20px;background:#dfc18a;
 color:#142b23;font-size:20px
}
button:disabled{opacity:.5}
#horse{font-size:28px;overflow-wrap:anywhere}
#status,#counts{
 font-size:13px;color:#b3c7b9;line-height:1.8;
 white-space:pre-wrap
}
#counts{text-align:left}
a{color:#dfc18a;display:block;margin:16px 0}
footer{font-size:11px;color:#92a99b;line-height:1.8}
progress{width:100%;accent-color:#dfc18a}
</style>
</head>
<body>
<main>
<p class="subtitle">WORLD HORSE DISCOVERY</p>
<h1>🐎 世界競走馬ガチャ</h1>
<p>国境も時代も越えて、未知の名馬へ。</p>

<div class="panel">
<h3>抽選対象を選択</h3>
<div class="countries" id="countries"></div>
<button class="small" onclick="selectAll(true)">全選択</button>
<button class="small" onclick="selectAll(false)">全解除</button>
<button id="draw" onclick="drawHorse()">🐎 競走馬を発掘する</button>
<progress id="progress" hidden></progress>
<p id="status">9カ国・地域 / 多言語対応</p>
</div>

<div class="panel" id="result" hidden>
<p class="subtitle">DISCOVERED HORSE</p>
<p id="country"></p>
<h2 id="horse"></h2>
<div id="links"></div>
</div>

<div class="panel">
<h3>収録馬データベース</h3>
<div id="counts">初回抽選時に集計します。</div>
</div>

<footer>
WORLD HORSE DISCOVERY — Ver.2.0<br>
Wikipedia / Wikidata<br>
原則として生産国別・香港は所属馬<br>
Wikipedia掲載馬を対象としています
</footer>
</main>

<script>
const countries=[
 {name:"🇮🇪 アイルランド",sources:[
 ["en","Racehorses bred in Ireland"]]},
 {name:"🇬🇧 イギリス",sources:[
 ["en","Racehorses bred in the United Kingdom"]]},
 {name:"🇫🇷 フランス",sources:[
 ["en","Racehorses bred in France"],
 ["fr","Cheval de course né en France"],
 ["fr","Cheval de course français"]]},
 {name:"🇩🇪 ドイツ",sources:[
 ["en","Racehorses bred in Germany"],
 ["de","Rennpferd (Deutschland)"],
 ["de","Pferd (Deutschland)"]]},
 {name:"🇺🇸 アメリカ",sources:[
 ["en","Racehorses bred in the United States"]]},
 {name:"🇨🇦 カナダ",sources:[
 ["en","Racehorses bred in Canada"],
 ["fr","Cheval de course né au Canada"]]},
 {name:"🇭🇰 香港",sources:[
 ["en","Hong Kong racehorses"],
 ["en","Racehorses trained in Hong Kong"],
 ["zh","香港競賽馬匹"],
 ["zh","香港馬匹"],
 ["ja","香港の競走馬"]]},
 {name:"🇦🇺 オーストラリア",sources:[
 ["en","Racehorses bred in Australia"]]},
 {name:"🇯🇵 日本",sources:[
 ["en","Racehorses bred in Japan"],
 ["ja","日本生産の競走馬"],
 ["ja","日本の競走馬"]]}
];

const languages={
 en:"英語",de:"ドイツ語",fr:"フランス語",
 ja:"日本語",zh:"中国語"
};

const cache=new Map();
const $=id=>document.getElementById(id);

countries.forEach((c,i)=>{
 const label=document.createElement("label");
 const input=document.createElement("input");
 input.type="checkbox";
 input.value=i;
 input.checked=true;
 label.append(input," "+c.name);
 $("countries").appendChild(label);
});

function selectAll(value){
 document.querySelectorAll("input[type=checkbox]")
 .forEach(x=>x.checked=value);
}

async function api(lang,params){
 const url="https://"+lang+".wikipedia.org/w/api.php?"+
 new URLSearchParams({
 format:"json",formatversion:"2",origin:"*",...params
 });
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),30000);
 try{
  const r=await fetch(url,{signal:controller.signal});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  if(d.error)throw new Error(d.error.info);
  return d;
 }finally{clearTimeout(timer)}
}

function excluded(title){
 return /^(List of|Lists of|Liste |一覧|リスト)/i.test(title)
 ||/一覧$|消歧義|曖昧さ回避/.test(title);
}

async function discoverSources(country){
 const sources=new Map();
 for(const [lang,cat] of country.sources){
  sources.set(lang+":"+cat,[lang,cat]);
  try{
   const d=await api(lang,{
    action:"query",
    prop:"langlinks",
    titles:"Category:"+cat,
    lllimit:"500",
    redirects:"1"
   });
   for(const p of d.query.pages){
    for(const l of p.langlinks||[]){
     if(!languages[l.lang])continue;
     const name=l.title.replace(/^[^:]+:/,"");
     sources.set(l.lang+":"+name,[l.lang,name]);
    }
   }
  }catch(e){}
 }
 return [...sources.values()];
}

function childAllowed(title,lang){
 if(/ばんえい|競馬場|競馬関係者|騎手|調教師|馬主|競走一覧|競馬の競走|Liste|List of/i.test(title))
 return false;

 if(lang==="en"){
  return /racehorses bred in|racehorses trained in|Hong Kong racehorses/i.test(title);
 }
 if(lang==="ja"){
  return /日本|香港/.test(title)&&
  /競走馬/.test(title);
 }
 if(lang==="de"){
  return /Rennpferd|Galopprennpferd/.test(title);
 }
 if(lang==="fr"){
  return /cheval de course|cheval de sport|pur-sang/i.test(title);
 }
 if(lang==="zh"){
  return /香港|日本/.test(title)&&
  /馬匹|赛马|賽馬/.test(title);
 }
 return false;
}

async function collectCategory(lang,root){
 const queue=[root];
 const seen=new Set();
 const pages=new Map();

 while(queue.length){
  const cat=queue.shift();
  if(seen.has(cat))continue;
  seen.add(cat);
  let next={};

  do{
   const d=await api(lang,{
    action:"query",
    list:"categorymembers",
    cmtitle:"Category:"+cat,
    cmtype:"page|subcat",
    cmlimit:"500",
    ...next
   });

   for(const p of d.query.categorymembers||[]){
    if(p.ns===0&&!excluded(p.title)){
     pages.set(p.pageid,p);
    }
    if(p.ns===14&&childAllowed(p.title,lang)){
     const sub=p.title.replace(/^[^:]+:/,"");
     queue.push(sub);
    }
   }
   next=d.continue||null;
  }while(next);
 }
 return [...pages.values()];
}

async function identify(lang,pages,country){
 const horses=[];
 for(let i=0;i<pages.length;i+=50){
  const batch=pages.slice(i,i+50);
  const d=await api(lang,{
   action:"query",
   prop:"pageprops|langlinks",
   pageids:batch.map(p=>p.pageid).join("|"),
   lllimit:"500",
   llprop:"url"
  });

  for(const p of d.query.pages){
   if(p.missing||p.pageprops?.disambiguation!==undefined)
   continue;

   const qid=p.pageprops?.wikibase_item;
   if(!qid)continue;

   const links={};
   links[lang]=p.title;
   for(const l of p.langlinks||[]){
    if(languages[l.lang])links[l.lang]=l.title;
   }

   horses.push({
    id:qid,links:links,countries:[country]
   });
  }
 }
 return horses;
}

function merge(pool,horse){
 if(pool.has(horse.id)){
  const old=pool.get(horse.id);
  Object.assign(old.links,horse.links);
  old.countries=[...new Set([
   ...old.countries,...horse.countries
  ])];
 }else{
  pool.set(horse.id,{
   id:horse.id,
   links:{...horse.links},
   countries:[...horse.countries]
  });
 }
}

async function loadCountry(index){
 if(cache.has(index))return cache.get(index);

 const c=countries[index];
 const sources=await discoverSources(c);
 const pool=new Map();
 const errors=[];
 const totals={};

 for(const [lang,cat] of sources){
  $("status").textContent=
  c.name+" / "+(languages[lang]||lang)+
  " Wikipediaを調査中…\n"+cat;

  try{
   const pages=await collectCategory(lang,cat);
   if(!pages.length)continue;

   const horses=await identify(lang,pages,c.name);
   for(const h of horses)merge(pool,h);
   totals[lang]=(totals[lang]||0)+horses.length;
  }catch(e){
   errors.push(lang+"："+cat);
  }
 }

 const result={
  horses:[...pool.values()],
  errors,totals
 };
 if(result.horses.length&&!errors.length){
  cache.set(index,result);
 }
 return result;
}

async function drawHorse(){
 const selected=[
 ...document.querySelectorAll("input:checked")
 ].map(x=>Number(x.value));

 if(!selected.length){
  $("status").textContent="国・地域を選択してください";
  return;
 }

 $("draw").disabled=true;
 $("result").hidden=true;
 $("progress").hidden=false;
 $("progress").max=selected.length;
 $("progress").value=0;

 const pool=new Map();
 const warnings=[];
 const counts=[];

 try{
  for(const index of selected){
   const name=countries[index].name;
   try{
    const data=await loadCountry(index);
    data.horses.forEach(h=>merge(pool,h));

    counts.push(name+"："+
     data.horses.length.toLocaleString()+"頭");

    if(!data.horses.length){
     warnings.push(name+"：候補なし");
    }
    if(data.errors.length){
     warnings.push(name+"：一部取得失敗");
    }
   }catch(e){
    warnings.push(name+"：取得失敗");
    counts.push(name+"：取得失敗");
   }
   $("counts").textContent=counts.join("\n");
   $("progress").value++;
  }

  const list=[...pool.values()];
  if(!list.length)throw new Error("抽選候補がありません");

  const horse=list[Math.floor(Math.random()*list.length)];
  const links=horse.links;

  $("horse").textContent=
  links.ja||links.en||links.de||
  links.fr||links.zh;

  $("country").textContent=horse.countries.join(" / ");
  $("links").replaceChildren();

  for(const lang of ["ja","en","de","fr","zh"]){
   if(!links[lang])continue;
   const a=document.createElement("a");
   a.href="https://"+lang+".wikipedia.org/wiki/"+
   encodeURIComponent(links[lang].replace(/ /g,"_"));
   a.textContent=languages[lang]+"版 Wikipedia ↗";
   a.target="_blank";
   a.rel="noopener";
   $("links").appendChild(a);
  }

  const wd=document.createElement("a");
  wd.href="https://www.wikidata.org/wiki/"+horse.id;
  wd.textContent="Wikidataで調べる ↗";
  wd.target="_blank";
  wd.rel="noopener";
  $("links").appendChild(wd);

  $("result").hidden=false;

  $("status").textContent=
  "抽選対象："+list.length.toLocaleString()+"頭"+
  (warnings.length?"\n⚠ "+warnings.join("\n"):"");

 }catch(e){
  $("status").textContent=e.message+
  "\n"+warnings.join("\n");
 }finally{
  $("draw").disabled=false;
  $("progress").hidden=true;
 }
}
</script>
</body>
</html>
